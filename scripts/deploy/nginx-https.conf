# Obtain a trusted certificate named music-player-ip before enabling this site.
# Replace SERVER_IP with the public IPv4 address covered by the certificate.
server {
    listen 80 default_server;
    server_name SERVER_IP;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://SERVER_IP$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name SERVER_IP;
    ssl_certificate /etc/letsencrypt/live/music-player-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music-player-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MusicTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 0;
    client_body_timeout 1800s;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
